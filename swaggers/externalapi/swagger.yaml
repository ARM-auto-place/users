openapi: 3.0.0
servers:
    - {}
paths:
    /api/users/v1/car/favorite:
        get:
            tags:
                - ExternalAPI
            summary: Избранные автомобили пользователя
            parameters:
                - in: cookie
                  name: user_id
                  required: true
                  schema:
                    type: string
                    format: jwt
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: array
                                            items:
                                                $ref: '#/components/schemas/models.FavoriteCar'
                                            nullable: true
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
