                  name: user_id
                  required: true
                  schema:
                    type: string
                    format: jwt
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: array
                                            items:
                                                $ref: '#/components/schemas/models.MyCar'
                                            nullable: true
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
    /api/users/v1/profile:
        get:
            tags:
                - ExternalAPI
            summary: Профиль текущего пользователя
            parameters:
                - in: cookie
                  name: user_id
                  required: true
                  schema:
                    type: string
                    format: jwt
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            $ref: '#/components/schemas/models.Profile'
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
        post:
            tags:
                - ExternalAPI
            summary: Частичное обновление профиля
            parameters:
                - in: cookie
                  name: user_id
                  required: true
                  schema:
                    type: string
                    format: jwt
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/requestExternalAPIUpdateProfile'
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            $ref: '#/components/schemas/models.Profile'
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
                                            type: object
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/models.ResponseMeta'
                                    - type: object
                                      properties:
                                        data:
